name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    name: Core JVM tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/opt/android-sdk}"/platforms 2>/dev/null || true
          SDKMANAGER=""
          for p in "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager "${ANDROID_HOME}"/cmdline-tools/bin/sdkmanager; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if ! ls "${ANDROID_HOME}"/platforms/android-*/android.jar >/dev/null 2>&1; then
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null || true
              "$SDKMANAGER" "platforms;android-36"
            else
              echo "::error::no android.jar available and sdkmanager not found"
              exit 1
            fi
          fi
      - name: Run framework-free test suite
        run: |
          set +e
          ./tools/run-tests.sh > junit.log 2>&1
          code=$?
          set -e
          tail -n 120 junit.log
          if [ $code -ne 0 ]; then
            python3 tools/ci-issue-comment.py junit.log jvm-tests junit.log || true
            exit $code
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: jvm-tests
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK platform 36
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}"/platforms 2>/dev/null || true
          SDKMANAGER=""
          for p in "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager "${ANDROID_HOME}"/cmdline-tools/bin/sdkmanager; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if ! ls "${ANDROID_HOME}"/platforms/android-36/android.jar >/dev/null 2>&1; then
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null || true
              "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
            else
              echo "::error::android-36 missing and sdkmanager not found"
              exit 1
            fi
          fi
          if [ ! -x "${ANDROID_HOME}"/build-tools/36.0.0/apksigner ] && ls "${ANDROID_HOME}"/build-tools >/dev/null 2>&1; then
            if [ -n "$SDKMANAGER" ]; then
              "$SDKMANAGER" "build-tools;36.0.0"
            fi
          fi
      - name: Gradle wrapper sanity
        run: |
          mkdir -p logs
          java -version
          ./gradlew --version > logs/gradle-version.log 2>&1 || true
          tail -n 30 logs/gradle-version.log || true
          grep -E "Exception|Error|error|FAIL|denied|not found|mismatch|Could not|corrupt|invalid" logs/gradle-version.log | tail -n 3 | while IFS= read -r line; do echo "::error::$line"; done
          grep -q "Gradle " logs/gradle-version.log
      - name: Configure projects
        run: |
          mkdir -p logs
          set +e
          ./gradlew --no-daemon --console=plain help > logs/gradle-help.log 2>&1
          code=$?
          set -e
          tail -n 80 logs/gradle-help.log
          if [ $code -ne 0 ]; then
            python3 tools/ci-issue-comment.py gradle-help.log configure logs/gradle-help.log
            exit $code
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Assemble debug APK
        run: |
          mkdir -p logs
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug > logs/gradle-debug.log 2>&1
          code=$?
          set -e
          tail -n 150 logs/gradle-debug.log
          if [ $code -ne 0 ]; then
            python3 tools/ci-issue-comment.py gradle-debug.log assembleDebug logs/gradle-debug.log
            exit $code
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify debug APK (badging, permissions, signature, sha256)
        run: ./tools/ci-verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Assemble release APK (unsigned unless release env secrets are set)
        run: |
          mkdir -p logs
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease > logs/gradle-release.log 2>&1
          code=$?
          set -e
          tail -n 150 logs/gradle-release.log
          if [ $code -ne 0 ]; then
            python3 tools/ci-issue-comment.py gradle-release.log assembleRelease logs/gradle-release.log
            exit $code
          fi
        env:
          HOMERELAY_RELEASE_STORE_FILE: ${{ secrets.HOMERELAY_RELEASE_STORE_FILE }}
          HOMERELAY_RELEASE_STORE_PASSWORD: ${{ secrets.HOMERELAY_RELEASE_STORE_PASSWORD }}
          HOMERELAY_RELEASE_KEY_ALIAS: ${{ secrets.HOMERELAY_RELEASE_KEY_ALIAS }}
          HOMERELAY_RELEASE_KEY_PASSWORD: ${{ secrets.HOMERELAY_RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/homerelay-debug.apk
          cp app/build/outputs/apk/release/app-release*.apk out/homerelay-release.apk
          ls -la out/
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: homerelay-apks
          path: out/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: homerelay-apks
          path: out
      - name: Checksums
        run: (cd out && sha256sum *.apk > SHA256SUMS.txt) && cat out/SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            HomeRelay release build.

            **homerelay-debug.apk** — installable, signed with the standard Android debug key.
            **homerelay-release.apk** — signed with a private release key only if the repository
            owner configured HOMERELAY_RELEASE_* secrets; otherwise the release APK is unsigned
            and cannot be installed directly. See BUILDING.md for how to build a signed release
            APK with your own keystore.

            No M01/M36 hardware test results are claimed for this build; see the README.
            Verify on your own device and report findings.
